[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-invoices"
version = "0.1.0"
description = "Agentic invoice-processing pipeline (ingest, validate, approve, pay) for Acme Corp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "pandas>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "xai-sdk>=0.1",
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
acme-invoices = "acme_invoices.cli:main"

[tool.setuptools]
packages = ["acme_invoices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["acme_invoices"]
omit = ["acme_invoices/llm.py"]
